name: Sporttery daily scrape & publish

on:
  push:
    branches: [ "feature/football-mvp" ]
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 20:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run scraper (requests mode)
        run: |
          python backend/football/odds_scraper.py --fetch || true

      - name: Prepare publish directory
        run: |
          rm -rf publish || true
          mkdir -p publish
          # copy static page if present
          if [ -f backend/football/static/reports.html ]; then
            cp backend/football/static/reports.html publish/index.html
          fi
          # copy today's and existing JSON reports if any
          mkdir -p publish/reports
          cp backend/reports/*.json publish/reports/ 2>/dev/null || true
          ls -la publish || true

      - name: Commit and push to gh-pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config --global user.name "${GIT_AUTHOR_NAME}"
          git config --global user.email "${GIT_AUTHOR_EMAIL}"
          # create or switch to gh-pages branch
          if git show-ref --verify --quiet refs/heads/gh-pages; then
            git checkout gh-pages
            git rm -rf . || true
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi
          # copy the publish contents to root
          cp -r publish/* .
          # ensure no unwanted files
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish Sporttery reports: $(date -u +"%Y-%m-%d")"
            git push origin gh-pages --force
          fi
